name: SecureVault
options:
  bundleIdPrefix: dev.andrecoura
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  VaultCore:
    path: VaultCore
targets:
  SecureVault:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.andrecoura.SecureVault
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Secure Vault
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Desbloqueia o cofre com Face ID em vez de digitar a senha mestra."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  SecureVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SecureVault
      - package: VaultCore
  SecureVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SecureVault
schemes:
  SecureVault:
    build:
      targets:
        SecureVault: all
    test:
      gatherCoverageData: true
      coverageTargets: [SecureVault]
      targets: [SecureVaultTests, SecureVaultUITests]
  SecureVaultUnit:
    build:
      targets:
        SecureVault: all
    test:
      gatherCoverageData: true
      coverageTargets: [SecureVault]
      targets: [SecureVaultTests]
